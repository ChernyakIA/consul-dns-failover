name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Minimal checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: components/monitoring-controller/requirements.txt
      - name: Install test dependencies
        run: pip install -r components/monitoring-controller/requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q components
      - name: Run unit tests
        run: pytest
      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*'):
              if any(part in {'.git', '.venv'} for part in path.parts) or not path.is_file():
                  continue
              if path.suffix in {'.yml', '.yaml'}:
                  list(yaml.safe_load_all(path.read_text()))
              elif path.suffix == '.json':
                  json.loads(path.read_text())
          PY
      - name: Validate Docker Compose
        run: |
          cp deploy/docker/monitoring/service-manager-configs/service-manager.example.env deploy/docker/monitoring/service-manager-configs/service-manager.env
          cp deploy/docker/monitoring/agents-configs/agent.example.json deploy/docker/monitoring/agents-configs/consul-monitor-1-agent.json
          cp deploy/docker/monitoring/sensitive-agent.example.json deploy/docker/monitoring/agents-configs/sensitive-consul-monitor-1-agent.json
          CONSUL_HTTP_TOKEN=dummy docker compose -f deploy/docker/monitoring/compose.yml config --quiet
      - name: Validate Kustomize overlay
        run: kubectl kustomize deploy/k8s/overlays/example >/dev/null

  image-build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: monitoring-controller
            context: components/monitoring-controller
          - image: dns-controller
            context: components/dns-controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          tags: consul-dns-failover-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
