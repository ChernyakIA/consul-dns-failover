groups:
- name: dns-manager-alerts
  rules:

  # 1. Active domains registry change
  - alert: DnsManagerConsulRegistryUpdated
    expr: sum (pod, namespace) (count_over_time({namespace="consul-dev", pod=~"dns-manager-.*"} |= "Active domain registry successfully synchronized inside Consul KV"[1m])) > 0
    labels:
      severity: warning
      loki: noresolve
      category: specific
    annotations:
      summary: "Domain manifest updated in Consul KV."
      description: "The service successfully committed the new list of managed domains (GC manifest) to Consul."

  # 2. Existing A-records change (Patch)
  - alert: DnsManagerARecordChanged
    expr: |
      sum by (pod, namespace, domain, old_ips, new_ips) (
          count_over_time(
          {namespace="consul-dev", pod=~"dns-manager-.*"} 
          |= "патчу ttl" |= "ips"
          | regexp `\] (?P<domain>\S+) A: патчу.*?ips (?P<old_ips>\[.*?\])->(?P<new_ips>\[.*?\])`
          [1m]
          )
        ) > 0
    labels:
      severity: warning
      loki: noresolve
      category: specific
    annotations:
      summary: "Failover triggered: domain IP addresses changed."
      description: "Domain: {{ $labels.domain }}\nTraffic routed: {{ $labels.old_ips }} -> {{ $labels.new_ips }}"

  # 3. Topology changes (Creating new / Deleting old records via GC)
  - alert: DnsManagerTopologyChanged
    expr: |
      sum by (pod, namespace, action) (
        count_over_time(
          {pod=~"dns-manager-.*"} 
          |~ "(?P<action>creating new rrset|purging rrset id=)"
          [1m]
        )
      ) > 0
    labels:
      severity: warning
      loki: noresolve
      category: specific
    annotations:
      summary: "DNS topology changed (addition/removal)."
      description: "Action detected: '{{ $labels.action }}'. Check service logs for details on the affected domain."

  # 4. Critical Error: Selectel token unavailable (IAM)
  - alert: DnsManagerSelectelAuthFailure
    expr: |
      sum by (pod, namespace) (
        count_over_time(
          {pod=~"dns-manager-.*"} 
          |= "Selectel authentication failed:" 
          [1m]
        )
      ) > 0
    labels:
      severity: error
      loki: noresolve
      category: specific
    annotations:
      summary: "Selectel API authorization failure."
      description: "Failed to obtain IAM token (possibly invalid credentials or cloud.api.selcloud.ru outage). The Pod will exit (SystemExit) and enter CrashLoopBackOff."

  # 5. State read/write errors (Consul KV)
  - alert: DnsManagerConsulSyncError
    expr: |
      sum by (pod, namespace) (
        count_over_time(
          {pod=~"dns-manager-.*"} 
          |~ "Failed to (persist|retrieve) state (inside|from) Consul KV"
          [1m]
        )
      ) > 0
    labels:
      severity: error
      loki: noresolve
      category: specific
    annotations:
      summary: "Consul KV state synchronization failure."
      description: "The service Garbage Collector cannot update or read the domain manifest. Possible leakage of old DNS records (Orphans)."

  # 6. Other WARN/ERROR (Catch-all)
  # Excludes routine infrastructure change logs that are written at the WARNING level
  - alert: DnsManagerAppErrors
    expr: |
      sum by (pod, namespace) (
        count_over_time(
          {pod=~"dns-manager-.*"} 
          |~ "WARNING|ERROR" 
          !~ "patching record|creating new rrset|purging rrset|operation received with blank IP"
          [1m]
        )
      ) > 0
    labels:
      severity: warning
      loki: noresolve
      category: generic
    annotations:
      summary: "Unexpected WARN/ERROR level messages."
      description: "Anomalies detected in DNS Manager logs (excluding routine traffic failovers). Check logs for pod {{ $labels.pod }}."

  # 7. Reconciliation Cycle completed with errors (Script execution summary)
  - alert: DnsManagerReconciliationFailed
    expr: |
      sum by (pod, namespace) (
        count_over_time(
          {pod=~"dns-manager-.*"} 
          |= "Reconciliation completed with" 
          |= "error(s). Consul KV key registry update aborted."
          [1m]
        )
      ) > 0
    labels:
      severity: error
      loki: noresolve
      category: specific
    annotations:
      summary: "Partial or total failure of the DNS reconciliation cycle."
      description: "One or more Selectel API calls failed. The expected cluster state is not fully synchronized with the external DNS provider."
