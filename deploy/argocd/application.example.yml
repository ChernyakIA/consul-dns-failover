apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: consul-dns-failover
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/consul-dns-failover.git
    targetRevision: v1.0.0
    path: deploy/k8s/overlays/example
  destination:
    server: https://kubernetes.default.svc
    namespace: consul
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
