apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-manager
  namespace: consul
  labels:
    app.kubernetes.io/name: dns-manager
    app.kubernetes.io/part-of: dns-failover
    app.kubernetes.io/component: dns-manager
spec:
  replicas: 1
  strategy:
    # Два pod не должны одновременно изменять одни DNS zones.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-manager
  template:
    metadata:
      labels:
        app: dns-manager
        app.kubernetes.io/name: dns-manager
        app.kubernetes.io/part-of: dns-failover
        app.kubernetes.io/component: dns-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: selectel
          image: ghcr.io/chernyakia/consul-dns-failover-dns-controller:0.3.1
          imagePullPolicy: Always
          # emptyDir переживает restart отдельного container.
          # Если предыдущая exec-команда завершилась с ошибкой, старый destination останется
          # неизменным и consul-template не вызывает после рестарта до изменения состояния catalog.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -f /work/service-state.json ]; then
                echo "Удаляю оставшийся после предыдущего запуска файл /work/service-state.json перед запуском Selectel DNS-manager"
                rm -f /work/service-state.json
              fi
              exec consul-template -config=/etc/consul-template/selectel.hcl
          env:
            - name: CONSUL_HTTP_ADDR
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: CONSUL_HTTP_ADDR}
            - name: DNS_PROVIDER_NAME
              value: selecteldns
            - name: CONSUL_CACERT
              value: /consul/tls/ca/tls.crt
            - name: CONSUL_HTTP_TOKEN
              valueFrom:
                secretKeyRef: {name: consul-dns-manager-token, key: token}
            - name: CONSUL_CONFIG_PATH
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: CONSUL_CONFIG_PATH}
            - name: CONSUL_GC_PATH
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: CONSUL_GC_PATH}
            - name: SERVICE_NAME_REGEX
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: SERVICE_NAME_REGEX}
            - name: HTTP_CONNECT_TIMEOUT
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: HTTP_CONNECT_TIMEOUT}
            - name: HTTP_READ_TIMEOUT
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: HTTP_READ_TIMEOUT}
            - name: HTTP_RETRY_TOTAL
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: HTTP_RETRY_TOTAL}
            - name: SEL_ACCOUNT_ID
              valueFrom:
                secretKeyRef: {name: dns-manager-selectel-secrets, key: SEL_ACCOUNT_ID}
            - name: SEL_SERVICE_USER
              valueFrom:
                secretKeyRef: {name: dns-manager-selectel-secrets, key: SEL_SERVICE_USER}
            - name: SEL_SERVICE_PASS
              valueFrom:
                secretKeyRef: {name: dns-manager-selectel-secrets, key: SEL_SERVICE_PASS}
            - name: SEL_PROJECT_NAME
              valueFrom:
                secretKeyRef: {name: dns-manager-selectel-secrets, key: SEL_PROJECT_NAME}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 512Mi}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /etc/consul-template/selectel.hcl, subPath: selectel.hcl, readOnly: true}
            - {name: consul-ca, mountPath: /consul/tls/ca, readOnly: true}
            - {name: work-selectel, mountPath: /work}
            - {name: tmp-selectel, mountPath: /tmp}

        - name: windns
          image: ghcr.io/chernyakia/consul-dns-failover-dns-controller:0.3.1
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -f /work/service-state.json ]; then
                echo "Удаляю оставшийся после предыдущего запуска файл /work/service-state.json перед запуском WinDNS DNS-manager"
                rm -f /work/service-state.json
              fi
              exec consul-template -config=/etc/consul-template/windns.hcl
          env:
            - name: CONSUL_HTTP_ADDR
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: CONSUL_HTTP_ADDR}
            - name: DNS_PROVIDER_NAME
              value: windns
            - name: CONSUL_CACERT
              value: /consul/tls/ca/tls.crt
            - name: CONSUL_HTTP_TOKEN
              valueFrom:
                secretKeyRef: {name: consul-dns-manager-token, key: token}
            - name: CONSUL_CONFIG_PATH
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: CONSUL_CONFIG_PATH}
            - name: CONSUL_GC_PATH
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: CONSUL_GC_PATH}
            - name: SERVICE_NAME_REGEX
              valueFrom:
                configMapKeyRef: {name: dns-manager-config, key: SERVICE_NAME_REGEX}
            - name: WIN_SSH_HOST
              valueFrom:
                secretKeyRef: {name: dns-manager-windns-secrets, key: WIN_SSH_HOST}
            - name: WIN_SSH_KNOWN_HOSTS
              value: /etc/ssh/known_hosts
            - name: WIN_SSH_USER
              valueFrom:
                secretKeyRef: {name: dns-manager-windns-secrets, key: WIN_SSH_USER}
            - name: WIN_SSH_PASSWORD
              valueFrom:
                secretKeyRef: {name: dns-manager-windns-secrets, key: WIN_SSH_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 512Mi}
          securityContext: *restricted
          volumeMounts:
            - {name: config, mountPath: /etc/consul-template/windns.hcl, subPath: windns.hcl, readOnly: true}
            - {name: consul-ca, mountPath: /consul/tls/ca, readOnly: true}
            - {name: windns-known-hosts, mountPath: /etc/ssh/known_hosts, subPath: known_hosts, readOnly: true}
            - {name: work-windns, mountPath: /work}
            - {name: tmp-windns, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: dns-manager-config
        - name: consul-ca
          secret:
            secretName: consul-ca-cert
            items:
              - {key: tls.crt, path: tls.crt}
        - name: windns-known-hosts
          configMap:
            name: dns-manager-windns-known-hosts
        - {name: work-selectel, emptyDir: {}}
        - {name: work-windns, emptyDir: {}}
        - {name: tmp-selectel, emptyDir: {}}
        - {name: tmp-windns, emptyDir: {}}
